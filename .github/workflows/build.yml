# Builds each app's carrier for both architectures, checks it, and from main
# publishes it as ghcr.io/divbast/frankenphp:<app>, attested by this
# workflow. Apps copy the binary from that tag by digest, once their CI has
# verified the attestation with
#
#   gh attestation verify oci://ghcr.io/divbast/frankenphp@sha256:<digest> \
#     --repo divbast/frankenphp \
#     --signer-workflow divbast/frankenphp/.github/workflows/build.yml@refs/heads/main \
#     --source-ref refs/heads/main
#
# so the attesting job lives here, not in a reusable workflow, which would
# sign as itself instead.
name: build

on:
  pull_request:
  # Every merge publishes what it built.
  push:
    branches: [main]
  schedule:
    # The daily rebuild, from scratch. spc resolves the Go toolchain and most
    # C libraries to their newest release while the build runs, so a
    # rebuild of an unchanged main can hold different code. When main is
    # still the published commit, it publishes only when the version
    # manifest of either architecture moved; when main has moved past it,
    # as after a merge whose own publish failed, it publishes main.
    # 12:13 UTC, early enough that a start GitHub gives hours late still
    # lands before the apps' own daily slots, which take the new binary.
    - cron: '13 12 * * *'
  # The button: run from main, it publishes now, even when nothing moved.
  workflow_dispatch:

permissions: {}

# The mise every jdx/mise-action step below installs, which would otherwise
# be the newest release at least a day old when the step runs. Renovate
# moves it.
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.11.7

# GitHub keeps one pending run per group, and a newer one replaces it. The
# event in the group stops a push run replacing a pending daily or button
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash's pipefail, and its -e, in every run step
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    uses: divbast/ci/.github/workflows/lint.yml@9d7e2473be4834225ec6052e2893a2496b44b4ce # v1.13.0
    permissions:
      contents: read

  build:
    name: build (${{ matrix.app }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        app: [baikal, librespeed]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}

      # divbast/ci at the commit the workflows pin, and its tools in .ci/bin
      - run: just setup
      - run: just ci-tools

      # The default docker driver cannot export an OCI archive with its
      # provenance. The BuildKit daemon that builds the carrier is pinned
      # by digest, where the action would take buildx-stable-1 as it
      # stands that day; Renovate moves it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Pin the build clock to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "${GITHUB_ENV}"
      # Only for a pull request, whose build never publishes.
      - name: Cache the build layers
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.app }}-${{ matrix.arch }}-${{ hashFiles('Containerfile') }}-${{ github.run_id }}
          restore-keys: |
            buildx-${{ matrix.app }}-${{ matrix.arch }}-${{ hashFiles('Containerfile') }}-
            buildx-${{ matrix.app }}-${{ matrix.arch }}-

      # The same build arguments as `just build-app`, from the same command
      - name: Build the carrier
        env:
          APP: ${{ matrix.app }}
          # Read-only, for spc's calls to the GitHub API, which fail the
          # build once the runner's unauthenticated rate limit runs out. It
          # reaches build-static.sh as a secret, never a build argument.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refuses an apps/<app>.env that sets anything but the four
          # inputs, and the substitution fails the step when it does.
          out=$(go run ./cmd/frankenphp-buildargs "${APP}")
          mkdir -p /tmp/carrier
          args=(
            --target carrier --build-arg "APP=${APP}"
            --secret 'id=github_token,env=GITHUB_TOKEN'
            --attest 'type=provenance,mode=max'
            --output 'type=oci,dest=/tmp/carrier/carrier.tar,rewrite-timestamp=true'
            -f Containerfile
          )
          while IFS= read -r arg; do
            args+=(--build-arg "${arg}")
          done <<<"${out}"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            args+=(
              --cache-from 'type=local,src=/tmp/.buildx-cache'
              --cache-to 'type=local,dest=/tmp/.buildx-cache,mode=max,reset=true'
            )
          else
            # Every run that can publish builds from scratch. spc fetches
            # the libraries as the build stage runs, so a cached stage would
            # publish what an earlier run fetched, which can be older than
            # what is already published.
            args+=(--no-cache)
          fi
          docker buildx build "${args[@]}" .

      # Every blob in the archive, the provenance included, which records
      # each build argument: a token passed as one shows here.
      - name: Check the carrier for the token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .ci/bin/divbast-token-leak /tmp/carrier/carrier.tar

      # Refuses a binary that carries a file capability, which no app could
      # exec under --cap-drop ALL, and records of another app or
      # architecture. The daily run's publish job compares the same
      # manifest with the published one's.
      - name: Read the carrier's manifest
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
        run: |
          go run ./cmd/frankenphp-manifest -oci /tmp/carrier/carrier.tar \
            -arch "${ARCH}" -app "${APP}" >/tmp/carrier/manifest.json
          cat /tmp/carrier/manifest.json

      - name: Keep the carrier for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carrier-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/carrier/
          retention-days: 1
          if-no-files-found: error

  # The one check main's ruleset requires, so the job list can change without
  # touching the ruleset. GitHub counts a skipped required check as passing,
  # so this runs always and treats a skipped or cancelled job as a failure.
  required:
    name: required
    needs: [lint, build]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [ "${result}" != success ]; then
              echo "a required job ended ${result}" >&2
              exit 1
            fi
          done

  # One per app. Both architectures this run built publish together, or
  # neither does: the index is made from the two images this job pushed,
  # by digest, so it never mixes runs. Each app's job waits for lint and
  # the build matrix but runs even when a leg failed, so one app's broken
  # build holds back only its own publish: that app's job fails fetching
  # the carrier its leg never uploaded, before it pushes anything, while
  # the other app's publishes. The run still ends red, through required.
  # cmd/frankenphp-manifest/workflow_test.go holds the condition below.
  publish:
    name: publish (${{ matrix.app }})
    needs: [lint, build]
    # From main only: a merge, the daily rebuild and the button.
    if: ${{ !cancelled() && needs.lint.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    strategy:
      # One app's failure must not cancel the other's publish halfway.
      fail-fast: false
      matrix:
        app: [baikal, librespeed]
    # Each run reads the published tag and then replaces it. One at a time
    # per tag, or each could decide against an image the other is
    # replacing. Queued, so a second waiting never cancels the first.
    concurrency:
      group: publish-${{ matrix.app }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # this run's start time, for the index's created annotation
      packages: write # push the images and the attestation below
      id-token: write # Sigstore signs against the runner's OIDC identity
      attestations: write # actions/attest writes the provenance
    env:
      IMAGE: ghcr.io/divbast/frankenphp
      APP: ${{ matrix.app }}
      # Every recipe runs through `mise exec`, which would otherwise first
      # install each tool in mise.toml that mise-action below leaves out.
      MISE_AUTO_INSTALL: "false"
    steps:
      # Full history, so the decision below can tell a newer commit from an
      # older one
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Of mise.toml's tools this job runs only just and Go, which builds
      # ci's tools and runs frankenphp-manifest; git, gh, skopeo, jq,
      # sha256sum and docker come with the runner. No linter belongs beside
      # these write scopes, so neither does `just setup`.
      # cmd/frankenphp-manifest/workflow_test.go holds the job to this.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: core:go aqua:casey/just
      # divbast/ci at the commit the workflows pin, and its tools in .ci/bin
      - run: just ci-checkout
      - run: just ci-tools
      # For `imagetools create`, which needs no daemon, though the action
      # starts one all the same: the same pinned BuildKit as the build's.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      # Both, or the job fails here, before anything is pushed: a leg
      # uploads its carrier as its last step, so a failed leg uploads none.
      - name: Fetch the amd64 carrier
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: carrier-${{ matrix.app }}-amd64
          path: /tmp/carriers/amd64
      - name: Fetch the arm64 carrier
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: carrier-${{ matrix.app }}-arm64
          path: /tmp/carriers/arm64

      # Publish, skip or fail. A merge publishes its commit, and the button
      # always publishes. The daily run publishes when main moved past what
      # is published, and otherwise when either architecture's manifest
      # moved from the published one. Only that run compares manifests: a
      # merge's run, racing the daily run on the same commit, or a re-run
      # with its old carriers, would otherwise publish libraries its build
      # fetched earlier over what the daily run had just published. Nothing
      # moves the tag back to an older commit either. It reads only
      # :<app>, never the staging tag below, so an index staged but never
      # promoted does not count as published.
      # cmd/frankenphp-manifest/workflow_test.go holds the condition below.
      # GH_TOKEN tells a private package from an absent one.
      - name: Decide whether to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout points origin/main at the commit this run built,
          # not at main's tip, so a newer published commit would read as one
          # that is not on main. The repository is public; no credentials.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! published=$(.ci/bin/divbast-published-revision "${IMAGE}:${APP}"); then
            echo "::error::Cannot read what ${IMAGE}:${APP} was built from. If the package is private, as its first push can leave it, the owner makes it public in its settings (https://github.com/orgs/divbast/packages/container/frankenphp/settings); nothing in this workflow can."
            exit 1
          fi
          args=(-event "${EVENT}" -built "${GITHUB_SHA}" -published "${published}")
          if [ "${EVENT}" = schedule ] && [ "${published}" = "${GITHUB_SHA}" ]; then
            # Every architecture, as an anonymous client pulls them
            skopeo copy --all --quiet --src-no-creds "docker://${IMAGE}:${APP}" oci-archive:/tmp/published.tar
            change=$(go run ./cmd/frankenphp-manifest -changes -app "${APP}" -published /tmp/published.tar \
              amd64=/tmp/carriers/amd64/carrier.tar arm64=/tmp/carriers/arm64/carrier.tar)
            args+=(-content-change "${change}")
          fi
          .ci/bin/divbast-publish-decision "${args[@]}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.decide.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # From here to the verification, every step leaves :<app> where it
      # was, so apps never see a digest with no attestation, and a re-run
      # of this job decides against that tag and publishes again. The last
      # step says so on a failure.
      # cmd/frankenphp-manifest/workflow_test.go holds the order.

      # Each to its own tag, which only feeds the index below
      - name: Push both architectures
        if: steps.decide.outputs.publish == 'true'
        run: |
          for arch in amd64 arm64; do
            skopeo copy --all --quiet \
              --digestfile "/tmp/digest-${arch}" \
              --dest-authfile "${HOME}/.docker/config.json" \
              "oci-archive:/tmp/carriers/${arch}/carrier.tar" \
              "docker://${IMAGE}:${APP}-${arch}"
          done

      # The index, tagged only :<app>-staging, which no app reads. The
      # description is what GHCR shows on the package page; the version is
      # FrankenPHP's. created is when this run, or this attempt at it,
      # started: the commit's time would date a daily republish of an
      # unchanged commit by that commit.
      - name: Stage the index
        if: steps.decide.outputs.publish == 'true'
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er .frankenphp /tmp/carriers/amd64/manifest.json)
          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          if [[ ! "${created}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::GitHub gave this run's start time as '${created}', not a UTC time such as 2026-11-13T12:13:00Z."
            exit 1
          fi
          docker buildx imagetools create \
            --metadata-file /tmp/index.json \
            --annotation "index:org.opencontainers.image.version=${version}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.created=${created}" \
            --annotation "index:org.opencontainers.image.description=The FrankenPHP binary for divbast's ${APP} image, and the records of how it was built" \
            -t "${IMAGE}:${APP}-staging" \
            "${IMAGE}@$(cat /tmp/digest-amd64)" \
            "${IMAGE}@$(cat /tmp/digest-arm64)"
          digest=$(jq -er '."containerimage.descriptor".digest' /tmp/index.json)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # Says the index came out of this workflow on main, signed against the
      # runner's OIDC identity: what apps verify before they build.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.decide.outputs.publish == 'true'
        with:
          subject-name: ghcr.io/divbast/frankenphp
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # What every app's CI runs before it builds on this digest, here
      # before any app can see it. The index's bytes come by digest, as an
      # anonymous client gets them, and must hash back to it; gh then
      # verifies that file, and never reads a registry login.
      - name: Verify the attestation as apps do
        if: steps.decide.outputs.publish == 'true'
        id: verify
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skopeo inspect --raw --no-creds "docker://${IMAGE}@${DIGEST}" >/tmp/staged-index.json
          fetched=$(sha256sum /tmp/staged-index.json)
          if [ "sha256:${fetched%% *}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}@${DIGEST} came back as bytes that hash to sha256:${fetched%% *}."
            exit 1
          fi
          empty=$(mktemp -d)
          DOCKER_CONFIG="${empty}" gh attestation verify /tmp/staged-index.json \
            --repo divbast/frankenphp \
            --signer-workflow divbast/frankenphp/.github/workflows/build.yml@refs/heads/main \
            --source-ref refs/heads/main

      # One source and no annotations, so buildx pushes the staged index's
      # own bytes under :<app>, and the digest stays the one just verified.
      - name: Move the tag to the verified index
        if: steps.decide.outputs.publish == 'true'
        id: promote
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: docker buildx imagetools create -t "${IMAGE}:${APP}" "${IMAGE}@${DIGEST}"

      # What apps pull, as they pull it. A private package, or a tag that is
      # not the index just verified, fails the run here rather than in every
      # app's next build.
      - name: Check the tag is the pushed index to an anonymous client
        if: steps.decide.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          if ! pulled=$(skopeo inspect --raw --no-creds "docker://${IMAGE}:${APP}" | sha256sum) ||
            [ "sha256:${pulled%% *}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}:${APP} is not anonymously pullable as ${DIGEST}. If the package is private, as its first push can leave it, the owner makes it public in its settings (https://github.com/orgs/divbast/packages/container/frankenphp/settings); nothing in this workflow can."
            exit 1
          fi
          echo "${IMAGE}:${APP} is ${DIGEST} to an anonymous client"

      # A step before the move failed, so the move never ran.
      - name: Say what the failure left
        if: failure() && steps.decide.outputs.publish == 'true' && steps.promote.outcome == 'skipped'
        run: |
          echo "::error::No public tag moved: ${IMAGE}:${APP} still names the index it named before this run. Re-running the failed job publishes."
