# download-options as static-builder-gnu-1.13.6 ships them in
# /go/src/app/craft.yml, between the keys around them; the rest trimmed.

php-version: "8.5"

build-options:
  enable-zts: true
  with-config-file-path: "/etc/frankenphp"
  with-config-file-scan-dir: "/etc/frankenphp/php.d"
  no-strip: false
  with-upx-pack: false
  with-frankenphp-app: ""
  with-suggests: true

download-options:
  parallel: 10
  retry: 5
  # build-static.sh points this at the working tree it runs from
  custom-local: []

extra-env:
  OPENSSLDIR: "/etc/ssl"
